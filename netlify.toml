[build]
publish = "/public"
command = "hugo -d public"

[context.production.environment]
  HUGO_VERSION = "0.160.1"
  GO_VERSION="1.26"

[context.deploy-preview]
command = "hugo --gc -b $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
  HUGO_VERSION = "0.160.1"
  GO_VERSION="1.26"

[context.branch-deploy]
command = "hugo --gc -b $DEPLOY_PRIME_URL"
